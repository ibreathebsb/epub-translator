[project]
name = "epub-translator"
version = "0.1.0"
description = "Translate EPUB books with an LLM while keeping the book structure intact"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.2",
    "openai>=1.50",
    "google-genai>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
epub-translate = "epub_translator.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epub_translator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
